[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whole-law-basket"
version = "0.1.0"
description = "Composite Whole-Law Basket Choice & Generation Model with Differentiable Exponential-Race Plackett-Luce Quadrature and Comprehensive Baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["whole_law_basket*"]
